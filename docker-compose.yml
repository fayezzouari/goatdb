services:
  goatdb:
    build:
      context: .
      dockerfile: Dockerfile
    image: goatdb:local
    container_name: goatdb
    ports:
      - "${GOATDB_PORT:-8080}:8080"
    volumes:
      - goatdb_data:/data
    restart: unless-stopped
    # GOATDB_ADDR / GOATDB_DIR default to :8080 and /data in the image; the
    # healthcheck is defined in the Dockerfile.

volumes:
  goatdb_data:
    driver: local
